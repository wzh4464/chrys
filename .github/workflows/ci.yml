name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - run: uv sync --extra all
      - run: uv run ruff check src/ tests/ scripts/calibrate_gc_freeze.py scripts/gc_freeze_calibration_math.py
      - run: uv run ruff format --check src/ tests/ scripts/calibrate_gc_freeze.py scripts/gc_freeze_calibration_math.py

  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            artifact: linux
            os: linux
            runner: ubuntu-latest
            workers: 4
            pytest_args: tests --ignore=tests/architecture
          - label: macos
            artifact: macos
            os: macos
            runner: macos-latest
            workers: 6
            pytest_args: tests --ignore=tests/architecture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - run: uv sync --extra all
      - name: Typecheck (ty)
        run: uv run ty check --error-on-warning src/chrys
      - name: Prewarm src bytecode
        run: uv run python -m compileall -q src
      - name: Prewarm test collection
        # Measured on #553: cuts the test step ~90-100s on Linux/Windows, but
        # costs ~27s on macOS with no test-step payback — skip it there.
        if: matrix.os != 'macos'
        run: uv run pytest --collect-only -q -n 0 -m "not integration and not gc_calibration" ${{ matrix.pytest_args }}
      - name: Fetch ripgrep binary
        run: ./scripts/fetch_rg.sh
      # ``gc_calibration`` tests are slow real-App probes covered by the
      # scheduled gc-freeze-calibration workflow, not PR CI.
      - name: Run tests
        timeout-minutes: 10
        run: uv run pytest -q --tb=short --durations=20 --dist=worksteal --junitxml=test-results-${{ matrix.artifact }}.xml -n ${{ matrix.workers }} -m "not integration and not gc_calibration" ${{ matrix.pytest_args }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.artifact }}
          path: test-results-${{ matrix.artifact }}.xml

  test_windows:
    name: Windows shard (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: app/kernel
            artifact: windows-app-kernel
            pytest_args: tests/app tests/foundation tests/kernel
          - label: service/engine
            artifact: windows-service-engine
            pytest_args: tests --ignore=tests/app --ignore=tests/foundation --ignore=tests/kernel --ignore=tests/architecture
    steps:
      # Hosted Windows images already disable real-time Defender scanning, so
      # changing Defender settings here is a measured no-op.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Cache .venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('uv.lock', 'pyproject.toml') }}
      - run: uv sync --extra all
      - name: Typecheck (ty)
        # The check is shard-independent. Exclude only the known critical
        # shard so future label changes preserve coverage by default.
        if: matrix.label != 'app/kernel'
        run: uv run ty check --error-on-warning src/chrys
      - name: Prewarm src bytecode
        run: uv run python -m compileall -q src
      - name: Prewarm test collection
        run: uv run pytest --collect-only -q -n 0 -m "not integration and not gc_calibration" ${{ matrix.pytest_args }}
      - name: Fetch ripgrep binary
        run: .\scripts\fetch_rg.ps1
      # pytest-timeout's thread method can fail to kill workers blocked in
      # Windows IOCP, so the step also has a hard wall-clock limit.
      - name: Run tests
        timeout-minutes: 10
        # Private-repository Windows runners expose two CPUs. Two balanced
        # jobs provide real parallel capacity while four workers per job keep
        # latency-heavy async and subprocess tests moving.
        run: uv run pytest -q --tb=short --durations=20 --dist=worksteal --junitxml=test-results-${{ matrix.artifact }}.xml -n 4 -m "not integration and not gc_calibration" ${{ matrix.pytest_args }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.artifact }}
          path: test-results-${{ matrix.artifact }}.xml

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - run: uv sync --extra all
      - name: Run architecture tests
        timeout-minutes: 10
        run: uv run pytest -q --tb=short --durations=20 --junitxml=test-results-architecture.xml -n 0 -m "not integration and not gc_calibration" tests/architecture
      - name: Upload architecture test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-architecture
          path: test-results-architecture.xml

  test_windows_gate:
    name: Test (windows)
    if: always()
    needs: [test_windows, architecture]
    runs-on: ubuntu-slim
    steps:
      - name: Verify Windows shards and architecture tests
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          WINDOWS_RESULT: ${{ needs.test_windows.result }}
        run: |
          test "$WINDOWS_RESULT" = "success"
          test "$ARCHITECTURE_RESULT" = "success"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
