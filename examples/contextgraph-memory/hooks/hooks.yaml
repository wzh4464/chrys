version: 1
hooks:
  # after_turn fires after session.json has been saved. Durable async delivery
  # retries a failed repository write; stable ContextGraph trajectory IDs make
  # successful replay idempotent.
  - id: contextgraph-dynamic-deposit
    event: after_turn
    enabled: true
    match: { profile: Memory }
    run:
      type: command
      argv: ["python", "-m", "chrys.service.memory.contextgraph_deposit"]
    execution:
      mode: async
      delivery: durable
      timeout_seconds: 300
      on_error: warn
